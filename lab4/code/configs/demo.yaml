data:
  patch_size: 9
  images:
    - O013257.npz
dataloader_train:
  batch_size: 8192
  num_workers: 4
  shuffle: True
dataloader_val:
  batch_size: 8192
  num_workers: 0
  shuffle: False
autoencoder:
  n_input_channels: 8
  embedding_size: 8
optimizer:
  lr: 0.001
trainer:
  max_epochs: 1
  log_every_n_steps: 10
checkpoint:
  save_top_k: 1
  monitor: 'val_loss'
  mode: 'min'
  filename: 'nico_test-{epoch:03d}'
    # you should change "default" to something else
    # for your experiments
  dirpath: 'checkpoints'
# Weights & Biases logs the loss curve and this config to wandb.ai.
# Leave enabled: false to train with no account and no extra setup.
# To turn it on: set enabled: true, then run `wandb login` once on a login node.
wandb:
  enabled: false
  project: 'lab4-autoencoder'
  name: 'default'
    # you should change "default" to something else
    # for your experiments
